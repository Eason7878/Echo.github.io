<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Pencil Vocab</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 9vh 20px 60px; box-sizing: border-box; color: #1f2937; }

  /* 左上：生词本入口 */
  .book-link { position: fixed; top: 20px; left: 24px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: #6b7280; font-size: 0.9rem; padding: 6px 10px; border-radius: 8px; transition: background 0.15s; }
  .book-link:hover { background: #f5f6f7; color: #1f2937; }
  .book-link svg { color: #9ca3af; }

  /* 右上：菜单图标（暂为装饰） */
  .menu-ico { position: fixed; top: 20px; right: 24px; color: #9ca3af; padding: 6px; }

  .hero { text-align: center; width: 100%; max-width: 900px; position: relative; }
  h1 { font-size: clamp(2.4rem, 5.5vw, 3.2rem); font-weight: 700; margin: 0 0 6px; color: #111827; letter-spacing: 0.5px; }

  /* 彩色铅笔（标题下方） */
  .pencil-row { position: relative; display: flex; justify-content: center; margin: 14px 0 8px; }

  /* 左右句子：铅笔两侧 */
  .side-line { position: fixed; color: #d7dbe1; font-size: 0.92rem; letter-spacing: 0.5px; line-height: 1.7; user-select: none; }
  .side-line .u { text-decoration: underline; text-underline-offset: 3px; }
  .sl-left { top: 25%; left: 5vw; text-align: right; }
  .sl-right { top: 25%; right: 5vw; }

  /* 欢迎语 */
  .welcome { display: inline-flex; align-items: center; gap: 8px; color: #9ca3af; font-size: 0.98rem; margin-top: 64px; margin-bottom: 28px; }
  .welcome .mini-pencil { display: inline-flex; }

  /* 搜索栏 */
  .gsearch { position: relative; width: 100%; max-width: 520px; margin: 0 auto 56px; }
  .gsearch .gs-wrap { display: flex; align-items: center; background: #fff; border: 1.5px solid #e5e7eb; border-radius: 999px; padding: 0 18px; transition: border-color 0.15s, box-shadow 0.15s; }
  .gsearch .gs-wrap:focus-within { border-color: #9ca3af; box-shadow: 0 0 0 3px rgba(156,163,175,0.12); }
  .gsearch .gs-wrap svg { flex: none; color: #9ca3af; }
  .gsearch input { flex: 1; border: 0; outline: 0; padding: 13px 12px; font-size: 0.95rem; background: transparent; color: #1f2937; }
  .gsearch input::placeholder { color: #b6bcc6; }
  .gs-drop { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-height: 340px; overflow-y: auto; z-index: 50; display: none; text-align: left; }
  .gs-drop.show { display: block; }
  .gs-item { display: block; padding: 10px 16px; text-decoration: none; color: inherit; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
  .gs-item:last-child { border-bottom: 0; }
  .gs-item:hover { background: #f9fafb; }
  .gs-item .g-w { font-weight: 600; color: #111827; }
  .gs-item .g-ph { color: #9ca3af; font-size: 0.8rem; margin-left: 8px; }
  .gs-item .g-cn { color: #4b5563; font-size: 0.85rem; margin-top: 2px; }
  .gs-item .g-list { display: inline-block; margin-top: 3px; font-size: 0.72rem; color: #6b7280; background: #f3f4f6; border-radius: 5px; padding: 1px 7px; }
  .gs-empty { padding: 14px; color: #9ca3af; font-size: 0.85rem; text-align: center; }

  /* 词表卡片：两行式圆角矩形 */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; max-width: 800px; }
  @media (max-width: 700px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card { background: #fff; border: 1px solid #eceef1; border-radius: 16px; padding: 22px 20px; text-decoration: none; color: inherit; text-align: center; transition: border-color 0.15s, transform 0.15s; }
  .card:hover { border-color: #b9c0ca; transform: translateY(-2px); }
  .card .c-t { font-size: 1.05rem; font-weight: 700; color: #111827; margin-bottom: 5px; }
  .card .c-s { color: #9ca3af; font-size: 0.88rem; }
  .card .badge { display: inline-block; background: #f3f4f6; color: #6b7280; font-size: 0.72rem; border-radius: 6px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; font-weight: 500; }
</style>
</head>
<body>
  <a class="book-link" href="细节入口/生词本.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    生词本
  </a>
  <div class="menu-ico" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
  </div>

  <div class="hero">
    <h1>Color Pencil Vocab</h1>

    <!-- 彩色铅笔（卡通简笔，标题下方） -->
    <div class="pencil-row">
      <svg width="192" height="74" viewBox="0 0 150 58" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- 笔身（斜放，约15°） -->
        <g transform="rotate(-14 75 29)">
          <rect x="22" y="21" width="96" height="16" rx="3" fill="#F6D268"/>
          <!-- 红黄蓝彩条 -->
          <rect x="32" y="24" width="5" height="10" rx="2" fill="#E4572E"/>
          <rect x="39" y="24" width="5" height="10" rx="2" fill="#F6D268"/>
          <rect x="46" y="24" width="5" height="10" rx="2" fill="#4A90D9"/>
          <rect x="53" y="24" width="5" height="10" rx="2" fill="#E4572E"/>
          <rect x="60" y="24" width="5" height="10" rx="2" fill="#F6D268"/>
          <rect x="67" y="24" width="5" height="10" rx="2" fill="#4A90D9"/>
          <!-- 笔尖（彩色笔尖） -->
          <path d="M118 37 L140 29 L118 21 Z" fill="#4A90D9"/>
          <path d="M126 34.5 L140 29 L126 23.5 Z" fill="#E4572E"/>
          <!-- 橡皮 -->
          <rect x="13" y="21" width="9" height="16" rx="3" fill="#E8B4B8"/>
          <!-- 金属圈 -->
          <rect x="20" y="21" width="3" height="16" fill="#C9CDD4"/>
          <!-- 笔杆轮廓 -->
          <rect x="22" y="21" width="96" height="16" rx="3" stroke="#D9B95C" stroke-width="1.2"/>
        </g>
      </svg>
    </div>

    <!-- 左右句子：铅笔两侧 -->
    <div class="side-line sl-left">It's not<br><span class="u">hard.</span></div>
    <div class="side-line sl-right">It's just<br><span class="u">new.</span></div>

    <div class="welcome">
      <svg class="mini-pencil" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B9C0CA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Welcome to Color Pencil Vocab
    </div>

    <div class="gsearch">
      <div class="gs-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="gsInput" type="text" placeholder="搜英文单词或中文释义，回车查看（如 parasite / 群居 / 食欲）" autocomplete="off">
      </div>
      <div class="gs-drop" id="gsDrop"></div>
    </div>

    <div class="cards">
      <a class="card" href="细节入口/Word%20List%201%20-%20Biology%20.html"><div class="c-t">Word List 1</div><div class="c-s">· Biology<span class="badge">35 词</span></div></a>
      <a class="card" href="细节入口/Word%20List%202%20-%20Art.html"><div class="c-t">Word List 2</div><div class="c-s">· Art<span class="badge">24 词</span></div></a>
      <a class="card" href="细节入口/Word%20List%203%20-%20Animals.html"><div class="c-t">Word List 3</div><div class="c-s">· Animals<span class="badge">111 词</span></div></a>
      <a class="card" href="细节入口/Word%20List%204%20-%20Geography.html"><div class="c-t">Word List 4</div><div class="c-s">· Geography<span class="badge">60 词</span></div></a>
    </div>
  </div>

  <script src="资源/all-words.js"></script>
<script>
    // ===== 全局搜索 =====
    (function () {
      var input = document.getElementById('gsInput');
      var drop = document.getElementById('gsDrop');
      if (!input || !drop || !window.ALL_WORDS) return;
      var DATA = window.ALL_WORDS;
      function match(w, q) {
        q = q.trim().toLowerCase();
        if (!q) return false;
        if (w.word.toLowerCase().indexOf(q) !== -1) return true;
        if ((w.cn || '').indexOf(q) !== -1) return true;
        if ((w.cnPractice || '').indexOf(q) !== -1) return true;
        return false;
      }
      function render(q) {
        var list = DATA.filter(function (w) { return match(w, q); });
        if (!list.length) { drop.innerHTML = '<div class="gs-empty">没有匹配的词</div>'; drop.classList.add('show'); return; }
        var html = '';
        list.slice(0, 12).forEach(function (w) {
          var file = w.file;
          var href = '细节入口/' + file.replace(/ /g, '%20') + '#' + w.key;
          html += '<a class="gs-item" href="' + href + '"><div><span class="g-w">' + w.word + '</span><span class="g-ph">' + (w.phonetic || '') + '</span></div><div class="g-cn">' + (w.cn || '') + '</div><span class="g-list">' + w.list + '</span></a>';
        });
        drop.innerHTML = html;
        drop.classList.add('show');
      }
      input.addEventListener('input', function () {
        var q = input.value;
        if (!q.trim()) { drop.classList.remove('show'); return; }
        render(q);
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          var q = input.value;
          var first = DATA.filter(function (w) { return match(w, q); })[0];
          if (first) {
            window.location.href = '细节入口/' + first.file.replace(/ /g, '%20') + '#' + first.key;
          }
        }
        if (e.key === 'Escape') drop.classList.remove('show');
      });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.gsearch')) drop.classList.remove('show');
      });
    })();
  </script>
</body>
</html>
